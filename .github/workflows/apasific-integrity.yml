name: APASIFIC integrity

on:
  pull_request:
    branches: [main]
    paths:
      - "iaep-app/**"
      - ".github/workflows/apasific-integrity.yml"
  push:
    branches: [main]
    paths:
      - "iaep-app/**"
      - ".github/workflows/apasific-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iaep-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: iaep-app/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Verify source integrity contracts
        run: npm run verify:integrity
      - name: TypeScript type check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
